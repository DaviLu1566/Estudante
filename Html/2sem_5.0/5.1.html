
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estados da Região Sul</title>

    <link rel="stylesheet" type="text/css" href="css/estilo.css">
</head>
<body>

    <div class="container">

        <div class="painel-esquerdo">
            <select id="selectEstados" size="3">
                <option value="0" selected>PR</option>
                <option value="1">SC</option>
                <option value="2">RS</option>
            </select>
        </div>

        <div class="painel-meio">
            <button id="btnDetalhes">Detalhes</button>
        </div>

        <div class="painel-direito">

            <div class="card-info">
                <strong>Capital</strong>
                <div id="divCapital">-</div>
            </div>

            <div class="card-info">
                <strong>Área</strong>
                <div id="divArea">-</div>
            </div>

            <div class="card-info">
                <strong>População (Censo 2022)</strong>
                <div id="divPopulacao">-</div>
            </div>

            <div class="card-info">
                <strong>Bandeira</strong>
                <div id="divBandeira">-</div>
            </div>

        </div>
    </div>

    <script src="js/script.js"></script>

</body>
</html>
