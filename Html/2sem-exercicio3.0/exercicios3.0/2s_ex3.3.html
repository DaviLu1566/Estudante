<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
</head>
<body>
    <h1>Minha Lista de Tarefas</h1>
    <input type="text" id="descricaoTarefa" placeholder="Digite uma tarefa..."
    >
    <button onclick="adicionarTarefa()">Adicionar Tarefa</button>
    <ul id="minhasTarefas"></ul>
    <script>
        // 1. Array global vazio
        let listaDeTarefas = [];
        // 2. Função para adicionar uma tarefa
        function adicionarTarefa() {
            // Pega o que foi digitado
            let tarefa = document.getElementById("descricaoTarefa").value;
            // Adiciona a tarefa no array
            listaDeTarefas.push(tarefa);
            // Limpa o campo de texto
            document.getElementById("descricaoTarefa").value = "";
            // Atualiza a lista na tela
            atualizarLista();
        }
        // 3. Função responsável por atualizar a lista
        function atualizarLista() {
            // Limpa a lista visual
            document.getElementById("minhasTarefas").innerHTML = "";
            // Percorre o array usando for tradicional
            for (let i = 0; i < listaDeTarefas.length; i++) {
                // Adiciona cada tarefa dentro de um <li>
                document.getElementById("minhasTarefas").innerHTML +=
                    "<li>" + listaDeTarefas[i] + "</li>";
            }
        }

    </script>

</body>
</html>
