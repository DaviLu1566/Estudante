<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de saudação</title>
</head>
<body>
    digite seu nome: <input type="text" id="nome" placeholder="Digite seu nome">
    <button onclick="gerarSaudacao()">Gerar Saudação</button>
    <p id="mensagem"></p>

    <script>
        function gerarSaudacao() {
            const nome = document.getElementById('nome').value;
            const mensagem = `Olá, ${nome}! Bem-vindo(a) ao nosso site.`;
            document.getElementById('mensagem').textContent = mensagem;
        }
    </script>
</body>
</html>
