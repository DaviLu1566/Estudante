<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gerador de saudação</title>
  </head>
  <body>
    <h1>digite seu nome: </h1>
    <input type="text" id="nome" placeholder="Digite seu nome" />
    <button onclick="mostrarSaudacao()">Exibir Saudação</button>
    <p id="mensagem"></p>
    <script>
      function construirSaudacao(nome) {
        return `Olá, ${nome}! Seja bem-vindo ao curso de Web!`;
      }
      function mostrarSaudacao() {
        const nome = document.getElementById("nome").value;
        const saudacao = construirSaudacao(nome);
        document.getElementById("mensagem").textContent = saudacao;
      }
    </script>
  </body>
</html>
