<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro de candidatos</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Inclusão dos scripts dos partidos -->
    <script src="script.js"></script>
  </head>
  <body>
    <h1>Registro de Candidatos</h1>

    <div class="form-group">
      <label for="txtNumeroPartido">Número do Partido:</label>
      <input
        type="text"
        id="txtNumeroPartido"
        placeholder="Digite o número (ex: 91)"
        onchange="processarPartido()"
      />
      <span id="msgErroPartido" class="erro"></span>
    </div>

    <div class="form-group">
      <label>Nome do Partido:</label>
      <span id="lblNomePartido"><b>---</b></span>
    </div>

    <div class="form-group">
      <label for="lstCandidatos">Candidato:</label>
      <select id="lstCandidatos" size="5" onchange="selecionarCandidato()">
        <!-- Opções populadas via JS -->
      </select>
    </div>

    <div class="form-group">
      <label for="lstCargos">Cargo a Concorrer:</label>
      <select id="lstCargos" size="5">
        <option value="Presidente">Presidente</option>
        <option value="Governador(a)">Governador(a)</option>
        <option value="Senador(a)">Senador(a)</option>
        <option value="Deputado(a) Federal">Deputado(a) Federal</option>
        <option value="Deputado(a) Estadual">Deputado(a) Estadual</option>
      </select>
    </div>

    <div class="form-group">
      <label for="txtNumeroCandidato">Número do Candidato:</label>
      <input
        type="text"
        id="txtNumeroCandidato"
        placeholder="Informe o número do candidato"
      />
      <span class="rules">
        Regras: XX - Presidente/Governador(a); XXn - Senador(a); XXnn - Dep.
        Fed.; XXnnn - Dep. Est.</span
      >
      <span id="msgErroNumero" class="erro"></span>
    </div>

    <!-- Botões de ação solicitados -->
    <div class="actions">
      <button
        type="button"
        class="btn-primary"
        onclick="registrarCandidatura()"
      >
        Registrar Candidatura
      </button>
      <button type="button" class="btn-success" onclick="gravarEEnviarTSE()">
        Gravar e Enviar ao TSE
      </button>
    </div>
    <span id="msgFeedbackAcao"></span>

    <hr />

    <div id="painelCandidato" class="card-candidato" style="display: none">
      <h3>Dados do Candidato Selecionado</h3>
      <p><strong>Nome:</strong> <span id="infoNome">-</span></p>
      <p><strong>Cargo:</strong> <span id="infoCargo">-</span></p>
      <p><strong>Número:</strong> <span id="infoNumero">-</span></p>
      <div>
        <strong>Foto:</strong><br />
        <img id="infoFoto" src="" alt="Foto do Candidato" />
      </div>
    </div>

    <h3>Candidaturas Registradas (Aguardando Envio)</h3>
    <ul id="listaRegistrados"></ul>

    <script>
      const registroCandidaturas = [];

      function processarPartido() {
        const numeroPartido = document.getElementById("txtNumeroPartido").value;

        const msgErro = document.getElementById("msgErroPartido");

        const lista = document.getElementById("lstCandidatos");

        msgErro.textContent = "";
        lista.innerHTML = "";

        if (numeroPartido !== "93") {
          msgErro.textContent = "Partido inválido. Informe 93.";

          document.getElementById("lblNomePartido").innerHTML = "<b>---</b>";

          return;
        }

        document.getElementById("lblNomePartido").innerHTML = "<b>PDC</b>";

        carregarCandidatos();

        setTimeout(() => {
          lista.innerHTML = "";

          candidatos.forEach((candidato, indice) => {
            const option = document.createElement("option");

            option.value = indice;
            option.textContent = candidato.nome;

            lista.appendChild(option);
          });
        }, 500);
      }

      function selecionarCandidato() {
        const indice = document.getElementById("lstCandidatos").value;

        const candidato = candidatos[indice];

        if (!candidato) return;

        document.getElementById("infoNome").textContent = candidato.nome;

        document.getElementById("infoCargo").textContent =
          candidato.cargo || "-";

        document.getElementById("infoNumero").textContent =
          candidato.numero || "-";

        document.getElementById("infoFoto").src = candidato.foto;

        document.getElementById("painelCandidato").style.display = "block";
      }

      function registrarCandidatura() {
        const indice = document.getElementById("lstCandidatos").value;

        const cargo = document.getElementById("lstCargos").value;

        const numero = document
          .getElementById("txtNumeroCandidato")
          .value.trim();

        const candidato = candidatos[indice];

        if (!candidato) {
          alert("Selecione um candidato.");

          return;
        }

        if (!cargo || !numero) {
          alert("Preencha todos os campos.");

          return;
        }

        if (!validarNumeroCandidato(numero, cargo)) {
          document.getElementById("msgErroNumero").textContent =
            "Número inválido.";

          return;
        }

        document.getElementById("msgErroNumero").textContent = "";

        const jaExiste = registroCandidaturas.some(
          (item) => item.nome === candidato.nome,
        );

        if (jaExiste) {
          alert("Candidato já registrado.");

          return;
        }

        const presidente = registroCandidaturas.filter(
          (item) => item.cargo === "Presidente",
        ).length;

        const governador = registroCandidaturas.filter(
          (item) => item.cargo === "Governador(a)",
        ).length;

        const senador = registroCandidaturas.filter(
          (item) => item.cargo === "Senador(a)",
        ).length;

        if (cargo === "Presidente" && presidente >= 1) {
          alert("Só é permitido 1 Presidente.");

          return;
        }

        if (cargo === "Governador(a)" && governador >= 1) {
          alert("Só é permitido 1 Governador.");

          return;
        }

        if (cargo === "Senador(a)" && senador >= 2) {
          alert("Só são permitidos 2 Senadores.");

          return;
        }

        candidato.cargo = cargo;
        candidato.numero = numero;

        registroCandidaturas.push({
          nome: candidato.nome,
          foto: candidato.foto,
          cargo: cargo,
          numero: numero,
        });

        const li = document.createElement("li");

        li.textContent = `${candidato.nome} - ${cargo} - ${numero}`;

        document.getElementById("listaRegistrados").appendChild(li);

        document.getElementById("infoCargo").textContent = cargo;

        document.getElementById("infoNumero").textContent = numero;

        document.getElementById("msgFeedbackAcao").textContent =
          "Candidatura registrada com sucesso.";
      }

      function gravarEEnviarTSE() {
        if (registroCandidaturas.length === 0) {
          alert("Nenhuma candidatura registrada.");

          return;
        }

        const json = JSON.stringify(registroCandidaturas, null, 2);

        console.log(json);

        localStorage.setItem("PDC", json);

        const blob = new Blob([json], { type: "application/json" });

        const link = document.createElement("a");

        link.href = URL.createObjectURL(blob);

        link.download = "PDC.json";

        link.click();

        document.getElementById("msgFeedbackAcao").textContent =
          "Arquivo enviado ao TSE com sucesso.";
      }
    </script>
  </body>
</html>
