<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Controle de Estoque</title>

    <link rel="stylesheet" href="css/estilo.css">
</head>

<body>

    <header>
        <h1>Controle de Estoque</h1>

        <div class="btn-group">

            <button onclick="carregarEstoque()">
                Carregar estoque
            </button>

            <button onclick="incluirProduto()">
                Incluir produto
            </button>

            <button class="btn-warning" onclick="atualizarEstoque()">
                Atualizar estoque
            </button>

            <button class="btn-success" onclick="salvarEstoque()">
                Salvar estoque
            </button>

        </div>
    </header>

    <main>
        <h2>Produtos cadastrados</h2>

        <div id="gridProdutos">
            <!-- Os produtos serão exibidos aqui pelo JavaScript -->
        </div>
    </main>

    <script src="js/script.js"></script>

</body>
</html>
